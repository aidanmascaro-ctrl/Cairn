name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo; give its token nothing else.
permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Node test suite spawns src/workers/bridge.py as a subprocess,
      # which imports ingest.py -> send2trash + opencv. Install Python deps so
      # the bridge process boots cleanly on the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/workers/requirements.txt

      - name: Install Python worker deps (needed by bridge subprocess)
        run: pip install -r src/workers/requirements.txt

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Python unit tests
        run: pip install pytest && pytest tests/python -q

  python:
    name: Python checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/workers/

      - name: Format check
        run: ruff format --check src/workers/
