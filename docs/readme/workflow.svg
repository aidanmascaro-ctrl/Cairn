<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b92a1"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="#16181f"/>

  <!-- 1. Card -->
  <g transform="translate(40 150)">
    <rect width="150" height="170" rx="16" fill="#232733" stroke="#353b4a"/>
    <path d="M45 40h46l14 14v56a6 6 0 0 1-6 6H45a6 6 0 0 1-6-6V46a6 6 0 0 1 6-6z" fill="#3a4152" stroke="#8b92a1" stroke-width="2"/>
    <rect x="52" y="48" width="6" height="14" rx="1" fill="#f4b860"/>
    <rect x="64" y="48" width="6" height="14" rx="1" fill="#f4b860"/>
    <rect x="76" y="48" width="6" height="14" rx="1" fill="#f4b860"/>
    <text x="75" y="145" font-size="20" font-weight="600" fill="#f5f6f8" text-anchor="middle">Camera card</text>
  </g>
  <line x1="196" y1="235" x2="244" y2="235" stroke="#8b92a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Offload -->
  <g transform="translate(252 40)">
    <rect width="300" height="390" rx="18" fill="#232733" stroke="#f4b860" stroke-opacity="0.6" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#f4b860">Offload</text>
    <text x="24" y="70" font-size="15" fill="#8b92a1">Mac menu-bar app</text>
    <g font-size="16" fill="#e4e6eb">
      <g transform="translate(24 98)">
        <rect width="252" height="58" rx="10" fill="#2c3140"/>
        <text x="14" y="25" font-weight="600">Skips what's already copied</text>
        <text x="14" y="45" font-size="13" fill="#9aa1b0">matched by content, not by name</text>
      </g>
      <g transform="translate(24 166)">
        <rect width="252" height="58" rx="10" fill="#2c3140"/>
        <text x="14" y="25" font-weight="600">Copies and checks every byte</text>
        <text x="14" y="45" font-size="13" fill="#9aa1b0">each file read back before it counts</text>
      </g>
      <g transform="translate(24 234)">
        <rect width="252" height="58" rx="10" fill="#2c3140"/>
        <text x="14" y="25" font-weight="600">Splits a card into shoots</text>
        <text x="14" y="45" font-size="13" fill="#9aa1b0">by time gaps, with a preview of each</text>
      </g>
      <g transform="translate(24 302)">
        <rect width="252" height="58" rx="10" fill="#2c3140"/>
        <text x="14" y="25" font-weight="600">Catalogues every drive</text>
        <text x="14" y="45" font-size="13" fill="#9aa1b0">search shoots, even unplugged</text>
      </g>
    </g>
  </g>
  <line x1="558" y1="235" x2="606" y2="235" stroke="#8b92a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Drive -->
  <g transform="translate(614 150)">
    <rect width="150" height="170" rx="16" fill="#232733" stroke="#353b4a"/>
    <rect x="35" y="42" width="80" height="62" rx="10" fill="#3a4152" stroke="#8b92a1" stroke-width="2"/>
    <circle cx="98" cy="90" r="4" fill="#5fd38d"/>
    <text x="75" y="138" font-size="20" font-weight="600" fill="#f5f6f8" text-anchor="middle">Your drive</text>
    <text x="75" y="160" font-size="13" fill="#9aa1b0" text-anchor="middle">Client / Shoot / Footage</text>
  </g>
  <line x1="770" y1="235" x2="818" y2="235" stroke="#8b92a1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Cairn in Resolve -->
  <g transform="translate(826 40)">
    <rect width="334" height="390" rx="18" fill="#232733" stroke="#7aa2f7" stroke-opacity="0.6" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#7aa2f7">Cairn</text>
    <text x="24" y="70" font-size="15" fill="#8b92a1">plugin inside DaVinci Resolve</text>
    <g font-size="16" fill="#e4e6eb">
      <g transform="translate(24 98)">
        <circle cx="14" cy="15" r="13" fill="#2c3140" stroke="#7aa2f7"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#7aa2f7" text-anchor="middle">1</text>
        <text x="40" y="21" font-weight="600">Ingest into bins</text>
      </g>
      <g transform="translate(24 152)">
        <circle cx="14" cy="15" r="13" fill="#2c3140" stroke="#7aa2f7"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#7aa2f7" text-anchor="middle">2</text>
        <text x="40" y="21" font-weight="600">Classify A-roll / B-roll</text>
      </g>
      <g transform="translate(24 206)">
        <circle cx="14" cy="15" r="13" fill="#2c3140" stroke="#7aa2f7"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#7aa2f7" text-anchor="middle">3</text>
        <text x="40" y="21" font-weight="600">Colour-code the media pool</text>
        <rect x="40" y="32" width="26" height="10" rx="3" fill="#4f8cff"/>
        <rect x="72" y="32" width="26" height="10" rx="3" fill="#4cc38a"/>
        <rect x="104" y="32" width="26" height="10" rx="3" fill="#f2c94c"/>
      </g>
      <g transform="translate(24 272)">
        <circle cx="14" cy="15" r="13" fill="#2c3140" stroke="#7aa2f7"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#7aa2f7" text-anchor="middle">4</text>
        <text x="40" y="21" font-weight="600">Build the assembly timeline</text>
      </g>
      <g transform="translate(24 326)">
        <circle cx="14" cy="15" r="13" fill="#2c3140" stroke="#7aa2f7"/>
        <text x="14" y="20" font-size="14" font-weight="700" fill="#7aa2f7" text-anchor="middle">5</text>
        <text x="40" y="21" font-weight="600">Pull selects</text>
        <text x="40" y="41" font-size="13" fill="#9aa1b0">focus · exposure · motion</text>
      </g>
    </g>
  </g>
</svg>
