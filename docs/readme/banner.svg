<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181f"/>
      <stop offset="1" stop-color="#1f2330"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <ellipse cx="190" cy="250" rx="150" ry="22" fill="url(#glow)"/>

  <!-- the cairn: four stacked stones -->
  <g transform="translate(190 0)">
    <ellipse cx="0" cy="226" rx="92" ry="26" fill="#5b6475"/>
    <ellipse cx="0" cy="219" rx="92" ry="24" fill="#7a8496"/>
    <ellipse cx="-6" cy="176" rx="70" ry="22" fill="#5f6b5c"/>
    <ellipse cx="-6" cy="170" rx="70" ry="20" fill="#86957f"/>
    <ellipse cx="5" cy="131" rx="50" ry="18" fill="#6b5a4c"/>
    <ellipse cx="5" cy="126" rx="50" ry="16" fill="#a08670"/>
    <ellipse cx="-2" cy="94" rx="32" ry="14" fill="#a7783f"/>
    <ellipse cx="-2" cy="90" rx="32" ry="12" fill="#f4b860"/>
  </g>

  <text x="350" y="138" font-size="84" font-weight="700" fill="#f5f6f8" letter-spacing="-2">Cairn</text>
  <text x="354" y="186" font-size="28" fill="#c9cdd6">From camera card to a sorted DaVinci Resolve project.</text>
  <text x="354" y="228" font-size="20" fill="#8b92a1">Offload copies and checks your cards · Cairn files, sorts and lays out the footage in Resolve</text>
</svg>
