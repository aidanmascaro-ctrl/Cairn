<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="376" rx="24" fill="#16181f"/>
  <text x="48" y="60" font-size="24" font-weight="700" fill="#f5f6f8">Selects: the usable moments in every clip</text>
  <text x="48" y="88" font-size="15" fill="#9aa1b0">Each sampled frame is scored for focus, exposure and steadiness. Strong runs become selects, laid out on their own timeline.</text>

  <!-- score chart -->
  <g transform="translate(48 116)">
    <rect width="1104" height="200" rx="16" fill="#1d2029" stroke="#353b4a"/>
    <!-- threshold -->
    <line x1="24" y1="78" x2="1080" y2="78" stroke="#f4b860" stroke-dasharray="6 6" stroke-opacity="0.8"/>
    <text x="28" y="70" font-size="12" fill="#f4b860">keep above</text>
    <!-- select runs -->
    <rect x="150" y="20" width="190" height="140" rx="6" fill="#4cc38a" fill-opacity="0.12"/>
    <rect x="560" y="20" width="250" height="140" rx="6" fill="#4cc38a" fill-opacity="0.12"/>
    <rect x="930" y="20" width="110" height="140" rx="6" fill="#4cc38a" fill-opacity="0.12"/>
    <!-- score line -->
    <path d="M24 130 C70 128, 100 120, 130 96 S170 44, 200 50 S280 40, 320 60 S360 120, 400 132 S470 150, 520 118 S560 60, 600 46 S700 38, 740 52 S790 70, 820 104 S870 150, 900 120 S940 50, 980 44 S1030 60, 1050 98 S1070 140, 1080 142" fill="none" stroke="#7aa2f7" stroke-width="3"/>
    <!-- clip frames -->
    <g fill="#2c3140" stroke="#353b4a">
      <rect x="24" y="170" width="1056" height="18" rx="4"/>
    </g>
    <rect x="150" y="170" width="190" height="18" rx="4" fill="#4cc38a"/>
    <rect x="560" y="170" width="250" height="18" rx="4" fill="#4cc38a"/>
    <rect x="930" y="170" width="110" height="18" rx="4" fill="#4cc38a"/>
  </g>
  <g transform="translate(48 344)" font-size="14" fill="#9aa1b0">
    <text>9 presets, from All-Rounder and Talking Head to Drone / Aerial and Locked-Off</text>
    <text x="1104" text-anchor="end">Same footage and settings give the same selects</text>
  </g>
</svg>
